name: Supabase keep-alive

# Le plan gratuit de Supabase met le projet en pause après 7 jours sans requête.
# Ce job fait une petite lecture 2 fois par semaine pour le garder actif.
on:
  schedule:
    - cron: "0 6 * * 1,4" # lundi et jeudi à 6h UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/missions?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
